      - name: "Publish Release v13.8.34 (Fix Game Picker, User/System App List Filtering & Custom AOT Picker Entry)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.34')
        with:
          tag_name: v13.8.34
          name: "Shizuku Sam v13.8.34 — 修复游戏模式无法添加游戏、用户/系统应用列表显示不全及自选 AOT 入口"
          body: |
            ### Shizuku Sam v13.8.34

            #### 🎮 修复「游戏模式 → 添加游戏应用」找不到游戏的问题
            - **修正游戏模式应用选择器绑定 (`HomeActivity.kt` / `MaxHzActivity.kt`)**：
              - 修复 `v13.8.33` 迁移 Miuix 游戏模式弹窗时将「+ 添加游戏应用」误绑到刷新率选择器（该选择器内部排除了游戏）的回归问题，现已正确调用专属 `showGameAutoAppPicker`；
              - 游戏选择器内自动将已识别的游戏带 `🎮` 标识优先置顶排列，并扩充主流游戏厂商包名识别规则。

            #### 📱 修复「用户应用」与「系统应用」显示数量异常偏少的问题
            - **修复用户安装应用被误判为系统预装而隐藏 (`MaxHzPackagePolicy.kt`)**：
              - 重构 `trustClass()`，严格依据 Android `FLAG_SYSTEM` 与系统分区路径判定系统应用；凡是用户自行安装在 `/data/app/` 下的应用（包括 Chrome、三星浏览器、Good Lock 模块、Samsung Health、SmartThings、Gboard 等 `com.google.*` / `com.samsung.*` / `com.sec.*` 包名应用）均 100% 正常显示在「用户应用」分栏。
            - **修复「系统应用」分栏只显示 2～3 个应用的问题 (`MaxHzPackagePolicy.kt` / `MaxHzActivity.kt`)**：
              - 移除旧版仅含 23 个包名的硬编码 `isCuratedUserFacingPreload` 白名单，放行所有含可执行代码（`FLAG_HAS_CODE != 0`）、非纯资源叠加层（RRO Overlay）的系统应用；
              - 在「系统应用」分栏中自动将带桌面启动图标的常用系统应用优先排在最上方。

            #### ⚡️ 刷新率专属规则与 AOT 自选预编译增强
            - **允许为游戏单独配置刷新率规则并修正优先级 (`MaxHzAccessibilityService.kt` / `MaxHzService.kt`)**：
              - 支持在「应用专属刷新率规则」中自由选择游戏；当游戏未被「游戏模式自动性能切换」接管但用户配置了专属刷新率规则时，优先执行用户规则；未配置规则的游戏保持 `game_passthrough` 直通保护。
            - **补回「🎯 自选应用 ART 预编译」入口 (`HomeGlassScreen.kt` / `HomeActivity.kt`)**：
              - 在「应用冷启动加速与清理」弹窗中补回「🎯 自选应用 ART 预编译 (热点/全量/已编译管理)」按钮。
          files: |
            releases/Shizuku-Sam-v13.8.34.apk

      - name: "Publish Release v13.8.35 (Fix Diagnostics State Sync, Accessibility Turn-Off & Per-App Refresh Rate UX)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.35')
        with:
          tag_name: v13.8.35
          name: "Shizuku Sam v13.8.35 — 修复诊断中心状态同步、无障碍一键关闭与「单应用独立刷新率」交互重构"
          body: |
            ### Shizuku Sam v13.8.35

            #### 🔍 修复「运行状态与覆盖项诊断中心」及首页开关与真实系统状态不一致
            - **实时核对系统底层真实状态 (`HomeActivity.kt`)**：
              - 每次返回首页或打开诊断中心时，通过 `PowerManager`、`ContentResolver` 及特权 Shell 异步回读 `low_power`、`sem_enhanced_cpu_responsiveness`、`pass_through`、`protect_battery`（区分三星基础保护 `3` 与自定义上限保护 `1`）、`cached_apps_freezer`、`device_idle_constants`、`location_background_throttle_interval_ms`、`wifi_scan_always_enabled`、`force_resizable_activities` 等底层真实值，彻底消除缓存开关与系统实际状态脱节的问题。
            - **修正省电自适应高刷文案与独立开关隔离 (`HomeActivity.kt` / `HomeGlassScreen.kt`)**：
              - 诊断中心 Mode 1 描述修正为 `• 全局性能模式：省电自适应高刷模式 (系统省电 + 120Hz 自适应)`；切换该模式时不再隐式污染独立的 `Quick Doze` 开关状态。
            - **自动清理已过期的未授权报错记录 (`HomeActivity.kt` / `HomeGlassScreen.kt`)**：
              - 当检测到 Root / Shizuku 特权通道已就绪时，自动清除早期因未授权留下的历史报错记录，避免诊断中心上下状态矛盾。

            #### ♿ 修复无障碍服务「开启后无法关闭」问题
            - **新增「关闭服务」一键按钮与原生 `disableSelf()` 支持 (`MaxHzAccessibilityService.kt` / `AccessibilityHelper.kt` / `HomeGlassScreen.kt`)**：
              - 在「单应用独立刷新率」页面的无障碍卡片上新增 **「关闭服务」** 按钮，结合 Android 原生 `AccessibilityService.disableSelf()` 与 `Settings.Secure` 清理，无需跳转系统设置即可一键停用。
              - 收紧后台无障碍保活自愈逻辑：仅当存在依赖无障碍的启用项（已配置单应用规则或开启了游戏自动加速）时才启用自愈，且识别到用户在系统「设置」手动关闭无障碍时不再强行重开。

            #### 🎨 重构「单应用独立刷新率」页面，消除与全局刷新率的认知混淆
            - **顶部常驻功能边界说明横幅 (`HomeGlassScreen.kt` / `strings.xml`)**：
              - 标题更新为 **「单应用独立刷新率」**，顶部常驻提示：*「💡 功能说明：此页面不是全局刷新率开关！仅对您在下方列表单独添加的应用生效……未添加的应用一律保持系统全局刷新率。」*
            - **按「第 1 步 → 第 2 步 → 第 3 步」重构规则配置流程**：
              - **第一步：点击选择目标应用**（置于卡片最顶部，未选时明确提示）；
              - **第二步：选择该应用的刷新率方案**（未选应用且未点击预设时不默认高亮任何胶囊，避免误认为全局档位）；
              - **第三步：该应用允许动态降频 (LTPO) 与上下限**（移除无障碍未开启时的强制拦截，并持久化草稿开关状态，彻底解决开关无法关闭或切页自动弹回开启的问题）。
          files: |
            releases/Shizuku-Sam-v13.8.35.apk

      - name: "Publish Release v13.8.36 (Align Authorized Apps with Upstream, Fix Per-App Refresh Rate Schemes & Protect System Defaults)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.36
          name: "Shizuku Sam v13.8.36 — 100% 对齐上游授权应用管理、修复单应用刷新率锁频失效与恢复默认 DPI/电池保护误改"
          body: |
            ### Shizuku Sam v13.8.36

            #### ⚡ 已授权应用 & 管理应用 100% 回归上游 (`RikkaApps/Shizuku`) 原生极速链路
            - **彻底解决隔夜点击已授权应用显示 `0` 与管理应用重新慢加载 3~6 秒问题 (`ShizukuService.java` / `InstalledPackagesCompat.java` / `AuthorizationManager.kt` / `AppsViewModel.kt` / `HomeActivity.kt`)**：
              - 移除 `InstalledPackagesCompat` 中会在无 Looper 的 Binder 线程抛异常的 `ActivityThread.systemMain()` 反射分支，恢复直接调用上游 `PackageManagerApis.getInstalledPackagesNoThrow`；
              - 移除 `AuthorizationManager.getPackages()` 中会遍历全机 400+ 应用并发起 800+ 次跨进程 IPC 的本地 PMS 全盘兜底扫描，恢复上游单次 `getApplications(-1)` 极速查询（耗时 `< 15ms`）；
              - 修复 `HomeActivity` 中非 `Status.SUCCESS` 状态将已授权数量覆盖为 `0` 的问题，并在 `checkServerStatus()`（`onResume`）中同步刷新已授权数量。

            #### 🎯 修复「单应用独立刷新率」锁频掉回 60Hz 及各方案路由 (`MaxHzRefreshSettings.kt` / `MaxHzController.kt` / `HomeGlassScreen.kt`)
            - **区分三星 One UI 标准 60Hz 模式 (`mode=0`) 与高/低刷定频窗口锁 (`mode=1`)**：
              - **游戏极速 (`120Hz` / `90Hz` 固定) & 超低刷定频 (`48Hz` / `30Hz` / `24Hz` 固定)**：使用 `refresh_rate_mode = 1` + `min_refresh_rate = hz, peak_refresh_rate = hz` 收拢上下限窗口强制锁定目标帧率，解决此前写入 `refresh_rate_mode = 0` 触发三星 60Hz 标准上限锁导致 120Hz 变 60Hz 的问题；
              - **视频节能 (`60Hz` 固定)**：使用 `refresh_rate_mode = 0` + `min = 60, peak = 60`；
              - **日常自适应 (`10~120Hz`) & 阅读护眼 (`10~60Hz`)**：使用 `refresh_rate_mode = 1` + `[minHz, maxHz]` 动态区间并清除省电刷新率限制位；
              - 当 Shizuku / Root Shell 就绪时同步通过 `UID 2000` 下发，并在最高刷新率下拉菜单中补全 `96Hz / 30Hz / 24Hz` 选项。

            #### 🛡️ 修复「恢复系统默认」导致 DPI/显示缩放异常及电池保护被改写 (`MaxHzController.kt`)
            - **消除物理显示模式锁定导致的 DPI 缩放异常**：
              - 在 `reload_samsung_adaptive_refresh()` 中移除强行锁定物理分辨率的 `cmd display set-user-preferred-display-mode`，统一替换为 `cmd display clear-user-preferred-display-mode 0` 与原生 `min_refresh_rate 0.0`。
            - **保护用户原有的三星电池保护设置**：
              - 恢复系统默认时，仅当本应用曾修改并备份过电池保护设置时才按备份还原；若用户从未开启本应用的电池保护，则保持系统原有 `protect_battery`（如 80% 最高保护）不变，不再无条件改写为基本保护。
          files: |
            releases/Shizuku-Sam-v13.8.36.apk

      - name: "Publish Release v13.8.37 (Align Authorized Apps with Shizuku Plus/Next, Fix Overnight 0 Count & App Management UI)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.37
          name: "Shizuku Sam v13.8.37 — 紧跟上游 Shizuku Plus/Next 授权体系、彻底解决隔夜清零与慢加载及应用管理弹窗 UI 问题"
          body: |
            ### Shizuku Sam v13.8.37

            #### ⚡ 紧跟上游 (`Shizuku Plus` & `Shizuku Next`) 授权与服务机制
            - **同步服务端 `updateFlagsForUid` 包名记录与 `ShizukuConfigManager` 防清零逻辑 (`ShizukuService.java` / `ShizukuConfigManager.java`)**：
              - 授权状态变更时完整记录 `packagesForUid` 列表（而非传入 `null`），并在启动扫描时仅在 `if (allowed)` 时同步写入，杜绝服务重启或运行时权限校验将已保存的 `FLAG_ALLOWED` 授权抹除；
              - 放宽服务端与客户端的 Shizuku 应用识别条件为 `API_V23` 权限 **或** `V3_SUPPORT` 元数据，确保所有新旧客户端应用均被完整识别。
            - **同步上游隔夜唤醒退避重试与代数锁防清零机制 (`AuthorizationManager.kt` / `AppsViewModel.kt`)**：
              - `AuthorizationManager.granted()` 对齐 Shizuku Plus (`#398`) 增加最多 3 次 `pingBinder()` 唤醒退避重试；
              - `AppsViewModel.load()` 对齐 Shizuku Plus (`#317` / `#424`) 引入单调递增代数令牌 `loadGeneration` 与非零授权数瞬态空返回保护，并共享内存与持久化快照，实现隔夜唤醒不归零、点击「管理已授权应用」**0ms 秒开**。
            - **兼容常驻旧版服务端与 One UI 8/9 (`InstalledPackagesCompat.java` / `AuthorizationManager.kt`)**：
              - 修复守护进程无 `Application` 时跨 Binder 线程获取 `SystemContext` 的兼容性，并在客户端合并纯内存级本地 `PackageManager` 过滤（循环内 0 次 IPC，耗时 `< 5ms`），彻底解决显示「暂未发现声明 Shizuku 权限的应用」及慢加载问题。

            #### 🎨 修复「应用管理」弹窗留白与背景透字问题 (`ApplicationManagementActivity.kt`)
            - 移除内部强制撑满 82% 屏幕高度的 `Modifier.fillMaxSize()`，改为 `wrapContentHeight()` 自适应包裹高度，消除应用较少或为空时底部的大片空白；
            - 提升弹窗表面不透明度并加深背景遮罩（`dimAmount = 0.58f`），彻底消除底层主页文字透出的重影。
          files: |
            releases/Shizuku-Sam-v13.8.37.apk

      - name: "Publish Release v13.8.38 (Full Upstream Alignment: 0ms Cold-Start App Management, ShizukuStateMachine, WADB & Root Starter)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.38
          name: "Shizuku Sam v13.8.38 — 全链路对齐上游 Shizuku Plus/Next：划掉后台/强退后秒开已授权应用、全局状态机与配对/Root 启动提速"
          body: |
            ### Shizuku Sam v13.8.38

            #### ⚡ 彻底解决「划掉后台 / 强制重启后，首页先显示 0 个、点开管理已授权应用长时间转圈」
            - **对齐上游 `AuthorizationManager.getPackages()` 极速路径与并发去重锁 (`AuthorizationManager.kt`)**：
              - 正常运行时仅执行一次服务端 `getApplications(-1)`（`< 15ms`），移除每次无条件双扫全机 `pm.getInstalledPackages` 的冗余逻辑，仅在旧服务端返回空或异常时兜底回退；
              - 新增 `scanLock` 互斥锁与 `2000ms` 节流缓存，将冷启动时原本并发撞车的 10~12 次全量扫描收敛为 **1 次**；
              - 新增已知客户端包名快照（`ShizukuSettings.getKnownClientPackages()` + `AuthorizationManager.getQuickPackagesFromSnapshot()`），划掉后台或强制重启后在 `< 2ms` 内定向查询已知客户端包并填充首帧。
            - **重构 `AppsViewModel` 与 `ApplicationManagementActivity` 首帧秒开机制**：
              - 新增 `AppsViewModel.ensureSnapshotHydrated()` 与跨实例缓存同步广播，在 `HomeActivity.onCreate()` 和 `ApplicationManagementActivity.onCreate()` 渲染首帧前即完成毫秒级预热，首帧直接展示真实已授权数量与应用列表，0 等待秒开；
              - `load(onlyCount = true)` 已有缓存时直接在内存中 `< 1ms` 统计授权数，不再触发全量包扫描；
              - 修复 `ApplicationManagementActivity` 在 `onCreate` 与首次 `onResume` 中连续重复调用 `load()` 的问题。

            #### 🔄 引入上游全局状态机 `ShizukuStateMachine` 与旧版服务端无感热升级
            - 新增 `ShizukuStateMachine.kt`，统一管理 `STARTING` / `RUNNING` / `STOPPING` / `STOPPED` / `CRASHED` 状态机与 `90s` 启动超时恢复；
            - 新增 `ShizukuStateMachine.isServerVersionSkewed()` 检测：当发现内存中仍驻留旧版本（如 `v13.7`）启动的 `shizuku_server` 时，自动在后台通过 Root / 无线调试无感重启升级服务端，使新版服务端的极速 `getApplications(-1)` 立即生效。

            #### 📡 对齐上游无线调试配对、连接与 Root 启动流程
            - **`AdbMdns.kt`**：对齐上游 `resolvedHost` 回环地址归一化（兼容 Android 16+ Local Network Protection）及解析失败时最多 5 次自动退避重发现；
            - **`AdbPairingService.kt`**：恢复配对失败通知栏「重试」按钮，并新增配对成功通知栏「立即启动」按钮（点击直接跳回 `HomeActivity` 自动启动无线调试服务）；
            - **`AdbStarter.kt` & `AdbStartWorker.kt`**：移除阻塞 ADB 启动关键路径的同步自加固 Shell 命令（改为后台延迟异步执行），并在锁屏等待解锁授权时调用 `setForegroundAsync`（`FOREGROUND_SERVICE_TYPE_SHORT_SERVICE`）保活；
            - **`Starter.kt` & `StarterActivity.kt`**：对齐上游 `internalCommand` 与 `Starter.waitForBinder()`，拿到 Binder 后 `350ms` 自动关闭返回主页（移除旧的 `3000ms` 硬编码等待）；
            - **`ShizukuReceiverStarter.kt` & `WatchdogService.kt`**：增加 `STARTING` / `RUNNING` 防重入锁（杜绝多广播并发拉起多个 `su` 进程），并将 `WatchdogService` 的自加固命令限制为每进程会话最多后台延迟执行一次，彻底消除冷启动时的后台 Shell 抢占。
          files: |
            releases/Shizuku-Sam-v13.8.38.apk

