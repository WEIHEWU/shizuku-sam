            #### 🐛 彻底修复点击「使用系统主题颜色」开关无效问题
            - 全局响应式主题色状态管理，关闭时严格应用 SamsungRootKit 经典翡翠绿（浅色 `#059669` / 深色 `#10B981`），开启时动态提取 Material You 壁纸主题色；
            - 彻底移除硬编码蓝色，所有开关轨道、滑块、按钮渐变与高光徽章实时跟随联动。
