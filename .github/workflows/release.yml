          body: |
            ### Shizuku Sam v13.8.23

            #### 🐛 彻底修复开启「游戏自动高刷加速」引发应用闪退与开屏死循环缺陷 (`MaxHzService.kt`)
            - **补充通知渠道注册**：
              - 彻底修复 `MaxHzService` 在前台服务初始化时遗漏调用 `createNotificationChannel()`，导致向系统服务发送不存在渠道的前台通知从而引发 `CannotPostForegroundServiceNotificationException` 导致进程闪退与开屏死循环的缺陷；
              - 在 `onCreate()` 与 `updateForegroundState()` 中增加双重渠道注册保障。
            - **规范前台服务类型声明**：
              - 适配 Android 10+ / 14+ 前台服务规范，在 `startForeground` 中显式指定 `FOREGROUND_SERVICE_TYPE_DATA_SYNC`。
          files: |
            releases/Shizuku-Sam-v13.8.23.apk

