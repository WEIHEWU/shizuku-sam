name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.0 (Refined Compact Miuix Typography & Row Proportions)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.0
          name: "Shizuku Sam v13.8.0 — 精细化全局字号层级与紧凑列表行距"
          body: |
            ### Shizuku Sam v13.8.0
            - **重构 `MiuixTheme` 全局字号体系 (`GlassTheme.kt`)**：
              - 修复 Miuix 默认 `17.sp` 列表标题与 `14.sp` 副标题偏大问题，全局收敛至 **列表主标题 `14.sp`、副标题 `11.5.sp`、分组标题 `12.sp`、按钮 `13.sp`**，与「调度档位」胶囊字号比例完全对齐，`充电上限保护 (80% / 75%)` 等长标题单行完整显示不再折行。
            - **优化页面副横幅 (`SectionHeader`) 与主状态卡 (`HeroCard`) 字号**：
              - 顶栏下方 `SectionHeader` 由 `27.sp` 收敛至精致的 `15.5.sp`（副标题 `11.5.sp`），不再与顶部 Toolbar 标题抢占视觉重心；
              - 列表项内边距收紧为 `14.dp × 11.dp`，搭配 `34.dp` 柔和粉彩圆角图标底座，一屏可容纳更多核心开关且呼吸感更佳。
          files: |
            releases/Shizuku-Sam-v13.8.0.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7' && github.ref_name != 'v13.7.8' && github.ref_name != 'v13.7.9' && github.ref_name != 'v13.8.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk


