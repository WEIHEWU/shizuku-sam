              - 全面覆盖主界面 3 个 Tab、底栏胶囊悬浮导航（`GlassDockNav`）、全应用卡片（`GlassCard`）及全局操作按钮（`GlassPillButton`）。
            - **所有二级、三级、四级独立 Activity 窗口与模态弹窗对齐**：
