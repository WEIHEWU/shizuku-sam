name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.5 (Fix Authorized Apps Crash & Optimize Selected Apps AOT Precompile)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.5
          name: "Shizuku Sam v13.8.5 — 修复授权管理闪退 & 优化指定应用预编译体验"
          body: |
            ### Shizuku Sam v13.8.5

            #### 🐛 崩溃与逻辑修复
            - **修复「管理已授权应用」点击闪退 (`ApplicationManagementActivity.kt` / `AppIconCache.kt`)**：
              - 移除会导致 Compose `painterResource` 抛出 `IllegalArgumentException` 崩溃的 `<adaptive-icon>` 占位符资源，改为安全矢量图标徽章 + 同步读取 `AppIconCache` 内存缓存。
            - **修复「指定应用预编译」进度条假 100% 与结果弹窗误报 (`MaxHzActivity.kt`)**：
              - 编译单个应用时进度条采用动态流光动画（`isIndeterminate = true`），编译多个应用时从 `0%` 按真实完成比例递增，全部完成才显示 `100%`；
              - 移除会导致失败时耗时翻倍的重复 `||` 命令，严格校验 `dex2oat` 返回码与输出，清晰区分全部成功（`🎉 指定应用预编译已完成` + 单应用实际耗时）、部分完成（`⚠️`）与未成功（`❌ 指定应用预编译未成功` + 底层失败原因）。
            - **修复「用户应用」列表混入已更新系统组件 (`MaxHzActivity.kt`)**：
              - 过滤 `FLAG_UPDATED_SYSTEM_APP` 与无代码纯资源包（`FLAG_HAS_CODE`），`AICore`、`AlwaysOnDisplay`、`Android Auto`、`Android System Key Verifier` 等更新过的系统组件不再混入「用户应用」，并在筛选按钮上实时显示精确数量：`用户 (N)` / `全部 (N)` / `系统 (N)`。

            #### ⚡ 体验与视觉优化
            - **默认预编译模式切换为「热点极速 (推荐) (`speed-profile`)」**：
              - 单应用仅需 `1 ~ 3 秒` 即可完成核心高频方法机器码编译（相比 `speed` 全量编译提速 10 倍以上且省空间），并在按钮下方实时显示当前模式的耗时与空间说明。
            - **应用列表新增真实图标与「已热点 / 已全量」绿色状态胶囊 (`MaxHzActivity.kt` / `MaxHzPrefs.kt`)**：
              - 列表每行异步加载真实应用图标，并对已编译过的应用持久化展示醒目的绿色胶囊标签（`已热点` / `已全量`）。
            - **提升弹窗内筛选胶囊按钮的未选中底色对比度**。
          files: |
            releases/Shizuku-Sam-v13.8.5.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7' && github.ref_name != 'v13.7.8' && github.ref_name != 'v13.7.9' && github.ref_name != 'v13.8.0' && github.ref_name != 'v13.8.1' && github.ref_name != 'v13.8.2' && github.ref_name != 'v13.8.3' && github.ref_name != 'v13.8.4' && github.ref_name != 'v13.8.5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
