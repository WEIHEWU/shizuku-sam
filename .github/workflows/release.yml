name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.7.3 (Initial Open-Source Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.7.3
          name: "Shizuku Sam v13.7.3 — 初版开源发布"
          body: |
            ### Shizuku Sam v13.7.3 (Initial Open-Source Release)
            - **Shizuku 增强内核 + 无 Wi-Fi 重启自启**：100% 兼容 `moe.shizuku.privileged.api` 生态，支持 `127.0.0.1` 本地回环端口并发扫描与开机自动激活无线调试。
            - **三通道执行引擎 (`SimEngine`)**：自动按 `Root (su) → Shizuku (rish/Binder) → Device Owner (DPM)` 路由底层指令并执行硬件回读校验。
            - **三星专属调校套件**：全局 120Hz / LTPO 刷新率控制、240Hz 游戏触控采样率与实时触控测试仪、色彩模式与硬件极暗、原生双击亮屏/锁屏、充电保护与快充总成、RAM Plus 虚拟内存、Private DNS (DoT) 加密解析。
          files: |
            releases/Shizuku-Sam-v13.7.3.apk

      - name: Publish Release v13.7.4 (Wireless Debugging Auto-Pairing Gate Fix)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.7.4
          name: "Shizuku Sam v13.7.4 — 修复无线调试配对弹窗拦截其他应用"
          body: |
            ### Shizuku Sam v13.7.4
            - **修复无线调试自动配对抢占问题**：新增显式配对会话门控（`PairingSessionGate` 10 分钟窗口），仅在从 Shizuku Sam 内发起配对时自动辅助填入配对码；已配对状态下或为其他 App 配对无线调试时不再自动跳出 Shizuku。
          files: |
            releases/Shizuku-Sam-v13.7.4.apk

      - name: Publish Release v13.7.5 (Deduplicate Bypass Charging Entry)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.7.5
          name: "Shizuku Sam v13.7.5 — 精简重复的旁路供电入口"
          body: |
            ### Shizuku Sam v13.7.5
            - **移除充电上限保护内重复的旁路供电卡片**：保留主列表统一的「旁路供电（游戏直供电）」开关（`pass_through`），使充电上限保护专注于 `protect_battery` 与 `battery_protection_threshold` 充电停止阈值控制。
          files: |
            releases/Shizuku-Sam-v13.7.5.apk

      - name: Publish Release v13.7.6 (Charging Limit Modal Dialog & Zero-Lag FPS Monitor)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.7.6
          name: "Shizuku Sam v13.7.6 — 充电上限居中弹窗 & 零延迟实时 FPS 悬浮窗"
          body: |
            ### Shizuku Sam v13.7.6
            - **充电上限保护改为居中弹窗**：与「电池运行信息与健康度」统一交互体验，支持 `80% / 85% / 90% / 95%` 快捷胶囊、自定义 `50~100%` 输入、一键恢复 100% 与即时应用。
            - **FPS 悬浮窗零延迟实时刷新**：新增 `dumpsys SurfaceFlinger --latency` 纳秒级帧时间戳差值算法（`computeSurfaceFlingerLatencyFps`）+ 持久 Shizuku Shell 管道复用 + `250ms` 采样周期（4Hz 刷新），彻底解决静止画面下 FPS 延迟回落问题。
          files: |
            releases/Shizuku-Sam-v13.7.6.apk

      - name: Publish Release v13.7.7 (Full Miuix / HyperOS UI Refactor)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.7.7
          name: "Shizuku Sam v13.7.7 — 全面重构为 Miuix (HyperOS) 原生 UI"
          body: |
            ### Shizuku Sam v13.7.7 (Miuix UI Edition)
            - **整套 UI 全面重构为 `miuix` (`top.yukonga.miuix.kmp:0.9.1`)**：
              - 全面接入 `MiuixTheme`（支持 HyperOS 浅色/深色/纯黑 OLED 与莫奈动态取色）、`Scaffold` 与 `overScrollVertical()` 物理越界回弹。
              - 三大 Tab 页面全部升级为 Miuix `SmallTitle`、`Card`（`PressFeedbackType.Sink` 按压下沉回弹）、`SwitchPreference`、`ArrowPreference`、`BasicComponent`、`Switch` 与 `OverlayDropdownPreference`。
              - **三大核心弹窗升级为 Miuix 原生 `OverlayDialog`**：充电上限保护弹窗、电池运行信息与健康度弹窗、停止服务确认弹窗均采用 Miuix 原生弹窗动画、`TextField` 与 `TextButton`。
          files: |
            releases/Shizuku-Sam-v13.7.7.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk

