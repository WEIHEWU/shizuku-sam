              - 以及服务停止确认、充电上限保护、电池健康信息、高级设置、版本更新等所有模态弹窗，均开启 `FLAG_BLUR_BEHIND` 窗口背景高斯模糊与发丝微光边框。
            - **MaxHz 2/3/4 级 View 详情页与原生对话框升级**：
