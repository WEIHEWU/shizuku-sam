name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Release APK Exists
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "releases/Shizuku-Sam-${{ github.ref_name }}.apk"

      - name: Publish Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
