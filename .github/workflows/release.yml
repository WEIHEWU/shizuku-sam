name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Publish Release v13.8.40 (Fix USB/Wireless Debugging Auto-Reopen, Hide Dhizuku Device Admin, Eliminate DPI/Resolution Changes, Fix Power Saver & Performance Profile Tile States)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.40
          name: "Shizuku Sam v13.8.40 — 修复 USB/无线调试无法手动关闭、隐藏 Dhizuku 设备管理项、彻底移除 DPI/分辨率修改及修复省电自适应双磁贴点亮状态"
          make_latest: true
          body: |
            ### Shizuku Sam v13.8.40

            #### 🔌 修复「USB 调试 / 无线调试无法手动关闭（被自动重开）」问题 (`AdbStartWorker.kt` / `AdbStarter.kt` / `HomeActivity.kt`)
            - **彻底移除所有写入 `Settings.Global.ADB_ENABLED` 的代码**：删除 `AdbStartWorker`、`AdbStarter`、`AdbDialogFragment`、`HomeActivity` 中强行将 `adb_enabled` 置为 `1` 的逻辑；
            - **移除 `ContentObserver` 强行重开循环与失败重试**：删除 `AdbStartWorker` 中监听到开关变化时最多 6 次强行重开的循环，超时或失败统一返回 `Result.failure()`；
            - **防止后台静默重开无线调试**：为 `AdbStartWorker` 与 `ShizukuReceiverStarter` 引入 `allowEnableWifi` 控制（后台自动重连默认 `false`），用户在系统设置关闭无线调试后不再被 `WatchdogService` 或 `HomeActivity.onResume()` 偷偷重新打开。

            #### 🛡️ 隐藏系统「设备管理应用程序」中的 `Shizuku (Dhizuku 模式)` (`AndroidManifest.xml`)
            - 将 `DhizukuAdminReceiver`、`DhizukuControlReceiver`、`DhizukuRequestPermissionActivity` 与 `DhizukuProvider` 默认设为 `android:enabled="false"`，使其不再出现在系统「设置 - 安全与隐私 - 更多安全设置 - 设备管理应用程序」列表中。

            #### 🖥️ 彻底消除「使用功能时触发意外的 DPI / 分辨率变动」(`MaxHzController.kt` / `MaxHzService.kt`)
            - **严格遵守绝不主动触碰系统 DPI 与分辨率原则**：移除 `guard_display_resolution_and_dpi_before_saver()`、`guard_display_resolution_and_dpi_after_saver()` 与 `restore_display_resolution_and_dpi()` 中所有读取/修改 `wm size`、`wm density`、`display_size_forced`、`display_density_forced` 的代码，仅保留 `pms_settings_screen_resolution_enabled 0` 防止省电模式自动降分辨率；
            - **优化亮屏刷新率同步**：修复 `MaxHzService.resolveDesiredRefreshMode()`，亮屏/同步刷新率时仅调用轻量级 `MaxHzRefreshSettings.applyScreenOnAdaptive()`，禁止重复执行完整省电切换脚本。

            #### 🔋 修复「省电自适应开启时，省电模式与性能配置磁贴未点亮」及切回状态回跳问题 (`MaxHzController.kt` / `HomeActivity.kt` / `MaxHzAccessibilityService.kt`)
            - **恢复以 `dumpsys power` 为唯一真实判据与 `0 -> 1` 边沿触发**：移除 `read_power_saver_service_state()` 和 `read_daily_power_saver_effective_state()` 开头读取 `low_power` 的短路逻辑；当 `dumpsys power` 未开启但 `low_power` 残留为 `1` 时，先置 `0` 等待 `0.10s` 再置 `1` 触发 `PowerManagerService` 状态跃迁，确认 `dumpsys power` 开启后再设置 `restricted_device_performance 1,1` 与 `sem_low_heat_mode 1`，使下拉状态栏「省电模式」与「性能配置（轻度）」双磁贴稳定点亮（若已处于开启态则不重复翻转避免磁贴闪烁）；
            - **修复切出应用再切回时误判回退到「游戏满血」**：在 `HomeActivity` 中增加 `isModeSwitching` 并发锁，统一基于 `PowerManager.isPowerSaveMode`、`dumpsys power` 与 `sem_enhanced_cpu_responsiveness` 同步真实模式状态，并在 `MaxHzAccessibilityService` 游戏进出时同步更新 `game_tile_mode`。
          files: |
            releases/Shizuku-Sam-v13.8.40.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.8.40'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
