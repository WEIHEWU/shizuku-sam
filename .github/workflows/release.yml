name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.2 (Per-Game Target Profile Override & Accurate README)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.2
          name: "Shizuku Sam v13.8.2 — 游戏自动高刷支持按游戏独立指定档位 & 文档全面重写"
          body: |
            ### Shizuku Sam v13.8.2
            - **新增「按游戏独立指定目标档位」 (`MaxHzPrefs.kt` / `MaxHzAccessibilityService.kt` / `MaxHzActivity.kt`)**：
              - 针对日常常驻 **「省电自适应」** 的用户，在「性能硬件 -> 游戏自动高刷加速 -> 已加入自动加速的游戏」列表中，支持为每一款游戏单独点击右侧胶囊切换专属档位：
                - **跟随全局默认**
                - **系统默认（解除省电限频·不发热）**：适合轻中度游戏，进入游戏自动解除系统省电模式的 CPU 70% 限频并保持 120Hz 自适应高刷，不强开满血、不额外发热；
                - **游戏性能模式（满血释放）**：适合重度大型游戏，锁定 CPU/GPU 满血调度与 120Hz 高刷；
                - **省电自适应高刷（省电+120Hz）**：适合棋牌/文字类超轻度休闲游戏；
              - 支持从游戏 A 直接切到游戏 B 时按各自独立档位无缝切换，并在彻底退回桌面或日常应用时，严格按照进入第一款游戏前保存的快照自动恢复原日常模式（如「省电自适应」）。
            - **全面重写 `README.md` 与 `README.en.md`**：
              - 100% 严格对齐当前真实 App 三栏结构（`Shizuku` · `性能硬件` · `应用规则`）与真实功能条目，剔除所有旧版残留与不实描述。
          files: |
            releases/Shizuku-Sam-v13.8.2.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7' && github.ref_name != 'v13.7.8' && github.ref_name != 'v13.7.9' && github.ref_name != 'v13.8.0' && github.ref_name != 'v13.8.1' && github.ref_name != 'v13.8.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
