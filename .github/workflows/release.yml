      - name: "Publish Release v13.8.30 (Persistent Accessibility Service Locking & Instant Self-Healing Engine)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.30')
        with:
          tag_name: v13.8.30
          name: "Shizuku Sam v13.8.30 — 无障碍服务持久锁定与秒级自愈引擎"
          body: |
            ### Shizuku Sam v13.8.30

            #### 🔒 彻底根治无障碍服务「容易被系统回收/假死掉线」的顽疾
            - **原生免 Root 0ms 进程内直写激活与自愈引擎 (`AccessibilityHelper`)**：
              - 充分利用应用激活时已获授的系统级 `WRITE_SECURE_SETTINGS` 永久特权（重启及强制停止后依然保留在应用身上），无需等待 Shell 或 Shizuku 进程，应用内直接通过 `ContentResolver` 在 0ms 内直接修改 `Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES` 和 `ACCESSIBILITY_ENABLED`，极速恢复服务！同时保留 Root / Shizuku Shell 作为双重兜底。
            - **破除假死/僵尸态强制重绑机制 (`pulseRebind`)**：
              - 针对三星 One UI 及 Android 进程被回收后，系统设置里开关虽然开着但 Binder 已断开（`isServiceAlive == false`，设置显示故障/已停止）的僵尸态：
                - 先通过 `PackageManager.setComponentEnabledSetting` 触发组件刷新事件；
                - 对 `Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES` 执行「先移除 -> 间隔 150ms -> 重新加入」的脉冲写入；
                - 强行激起系统 `AccessibilityManagerService` 重新 `bindService` 拉起无障碍服务。
            - **五重全生命周期联动锁定与秒级自愈**：
              - **开机与 Direct Boot**：为 `MaxHzAccessibilityService` 配置 `android:directBootAware="true"`，并在 `BootCompleteReceiver` 中开机即秒级自愈；
              - **三层看门狗守护**：常驻前台 `WatchdogService`、每 15 分钟精确闹钟 `WatchdogAlarmReceiver` 以及 `WatchdogWorker` 同步巡检；
              - **每次亮屏与解锁**：`MaxHzService` 在收到 `ACTION_SCREEN_ON` 与 `ACTION_USER_PRESENT` 时自动检查并自愈；
              - **意外断连救活**：无障碍服务被系统回收触发 `onUnbind`/`onDestroy` 时，延迟 1 秒自动抢救重绑；
              - **回到前台**：`HomeActivity` / `MaxHzActivity` 回到前台时自动巡检。
            - **刷新率调度零缝隙无缝接管 (`MaxHzService`)**：
              - 严格区分设置开启与进程存活状态，在无障碍服务重绑的毫秒级缝隙中，`MaxHzService` 自动通过前台应用轮询无缝接管刷新率切换，绝不空转，杜绝高刷停摆。
            - **三星 One UI 专属防冻结与休眠豁免 (`AdbStarter`)**：
              - 补充注入 `cmd appops set $pkg SYSTEM_EXEMPT_FROM_SUSPENSION allow`、`cmd appops set $pkg SYSTEM_EXEMPT_FROM_HIBERNATION allow`、`am set-inactive $pkg false`，防止 Freecess/MARS 深度休眠无障碍服务。
          files: |
            releases/Shizuku-Sam-v13.8.30.apk

      - name: "Publish Release v13.8.31 (Starter / Binder delivery reliability aligned with Shizuku Next & Plus)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.31')
        with:
          tag_name: v13.8.31
          name: "Shizuku Sam v13.8.31 — 修复「未运行·待激活 / can't kill」启动失败"
          body: |
            ### Shizuku Sam v13.8.31

            #### 🛠 修复无线调试启动报 `fatal: can't kill <pid>` 与 `warn: can't switch cgroup`
            - **starter**：cgroup 切换条件对齐 Shizuku Next / Plus（仅 root/system），shell 启动不再输出 `can't switch cgroup`；kill 旧进程遇 `EPERM` 时自动尝试 `su` 兜底；新增 `/proc/self/exe` 推导 APK 路径。
            - **AdbStarter**：无线调试启动前先 `Shizuku.exit()` 并用已授权的 Root 清理残留 `shizuku_server`（如开机 Root 脚本以 uid 0 拉起的进程）。
            - **BinderSender**（对齐 Shizuku Plus #319/#371）：Binder 投递失败不再被永久缓存，后续前台/状态事件会重试；服务启动 2 秒后对已运行的管理器/客户端补发一次 Binder。
            - **ShizukuService**（对齐 Shizuku Next / Plus）：`sendBinderToUserApp` 返回投递结果；投递管理器失败时强制停止后重试，修复「后台服务已在运行但 App 显示未运行·待激活」。
          files: |
            releases/Shizuku-Sam-v13.8.31.apk

      - name: "Publish Release v13.8.32 (Instant 0ms App Management with AppsRepository & Lifecycle Deduplication)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.32')
        with:
          tag_name: v13.8.32
          name: "Shizuku Sam v13.8.32 — 应用管理 0ms 秒开与全局内存预热缓存"
          body: |
            ### Shizuku Sam v13.8.32

            #### ⚡️ 彻底根治「管理已授权应用」每次点击都弹出「正在读取已安装应用列表...」与长时间等待
            - **全局预热单例缓存仓库 (`AppsRepository`)**：
              - 消除 Activity 之间的数据孤岛，主页启动时扫描到的授权应用直接常驻内存；
              - 点击「管理已授权应用」时首帧 **0ms 秒开**，直接渲染既有授权列表，彻底消灭全屏 Loading 卡片与等待白屏；
              - 仅在内存无缓存或缓存过期时在后台静默发起增量同步，平滑刷新。
            - **对齐上游消除生命周期并发竞争 (`ApplicationManagementActivity`)**：
              - 彻底移除 `onResume()` 中盲目重复触发的 `viewModel.load()`，只保留 UI 渲染 Tick，杜绝并发两次向系统 PMS 索取数百个应用全量清单造成的 Binder 拥堵与卡顿；
              - 开关切换时采用 `onlyCount = true` 局部定向刷新授权数字。
            - **原子代际防抖机制 (`loadGeneration`)**：
              - 对齐 Shizuku Plus #317 / #424，引入原子自增代号，废弃滞后的旧请求回调，避免列表闪烁，并对服务存活时的瞬态异常做缓存保护。
          files: |
            releases/Shizuku-Sam-v13.8.32.apk

      - name: "Publish Release v13.8.33 (Fix Game Partial-Screen Viewport Bug & Upgrade Shell Pool + Miuix Dialogs)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.33')
        with:
          tag_name: v13.8.33
          name: "Shizuku Sam v13.8.33 — 彻底修复游戏小窗/左上角 75% 黑边 Bug、常驻 Shell 会话池与 Miuix 诊断中心"
          body: |
            ### Shizuku Sam v13.8.33

            #### 🛠 彻底修复打开游戏偶发「左上角约 75% 小窗显示 + 右侧/底部黑边」问题
            - **移除游戏冷启动/横竖屏切换期的实时 `cmd game downscale` 干预**：
              - 彻底移除了 `MaxHzController` 在前台应用切换热路径中实时下发的 `cmd game mode ... downscale` 与 `cmd game set --downscale`，杜绝在 SurfaceFlinger 旋转与 Engine 首帧初始化窗口期触发 Configuration 竞态导致 Viewport 停留在缩放尺寸；
              - 游戏超采样/降分辨率改为仅在配置面板用户保存时静态下发。
            - **残留缩放配置自检与自动修复 (`sanitizeCorruptedGameDownscaleStates`)**：
              - 服务启动及前台进入未开启主动缩放的游戏时，自动巡检 `device_config get game_overlay` 与 `compat_scale`，若发现历史残留的 `< 1.0` 缩放因子立即静默重置为原生全屏。
            - **三星自适应刷新率重载防黑边 (`reload_samsung_adaptive_refresh`)**：
              - 优先读取 `Override size`（如 WQHD+ 切 FHD+ 场景）而非盲目使用 `Physical size`，并使用 `clear-user-preferred-display-mode 0` 替代硬编码 mode 1。

            #### ⚡️ 架构与体验全面升级
            - **常驻 Shell 会话池 (`MaxHzShell`)**：
              - 引入长连接 `sh` 会话池（Root / Shizuku 双通道独立复用），指令通过 `stdin` 管道 + 唯一回显 Token 同步读取，彻底告别高频 `fork/exec` 进程风暴。
            - **前台切换单次脚本合并与 180ms 防抖**：
              - `MaxHzAccessibilityService` 增加 180ms 窗口切换防抖与游戏全屏过渡期保护；`applyForegroundTransitionMerged` 将刷新率写入与关联进程唤醒/冻结收敛为单次 Shell 事务。
            - **Miuix 原生弹窗统一与「状态诊断与安全恢复中心」**：
              - 游戏智能识别、极速 Doze、应用启动加速全部升级为 Miuix `WindowDialog`；
              - 新增「状态诊断与安全恢复中心」与开机/崩溃安全兜底，支持实时查看分辨率/刷新率/动画/Doze/游戏缩放状态并一键恢复系统默认。
          files: |
