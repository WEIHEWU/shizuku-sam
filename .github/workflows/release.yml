name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.6 (Align Startup & Watchdog with ShizukuPlus & Fix AOT Precompile Timeout)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.6
          name: "Shizuku Sam v13.8.6 — 对齐上游保活自愈链路 & 修复微信/抖音等大型应用预编译超时"
          body: |
            ### Shizuku Sam v13.8.6

            #### 🐛 修复 AOT 应用预编译（如微信、抖音）超时与阻塞假死问题
            - **修复未授权 `su` 二进制文件引发的 Shell 阻塞假死 (`ShizukuShellBridge.kt` / `MaxHzShell.kt`)**：
              - 在 `ShizukuShellBridge` 中移除优先尝试 `Shizuku.newProcess(arrayOf("su"))` 的逻辑，直接通过 Shizuku 启动 `/system/bin/sh`；
              - 在 `MaxHzShell.detectRoot()` 中改为先执行 `waitFor(2, TimeUnit.SECONDS)` 再读取输出流，彻底消除部分机器存在未授权 `su` 二进制文件时卡死等待 Root 弹窗导致的 45 秒超时。
            - **对齐 Android 14+ 官方 `ArtService` 主包优先与增量编译策略 (`MaxHzActivity.kt`)**：
              - **热点极速 (`speed-profile`)**：优先使用 `--split ""` 仅重编主包 `base.apk`（跳过微信/抖音动态加载的几十个小程序/商城/直播插件 Secondary Dex），并在旧系统上自动回退增量编译（不加 `-f`）；
              - **全量编译 (`speed`)**：优先执行增量编译（复用已编译的动态插件），若未触发则使用 `--split "" -f` 强制重编主包 `base.apk`。
            - **放宽单应用超时阈值与实时秒数显示 (`MaxHzActivity.kt`)**：
              - 单应用超时阈值提升至 `speed-profile` **180 秒** / `speed` **360 秒**，编译弹窗实时刷新已耗时秒数（如 `已耗时 12s`），并修正不同编译模式的专属超时提示文案。

            #### 🔄 启动、配对与看门狗保活链路 1:1 严格对齐上游 `ShizukuPlus`
            - **对齐 C++ 启动器与看门狗三层保活自愈体系**：
              - 同步 `starter.cpp` 管道同步等待（`pipe` + `poll`）与 `switch_cgroup()` 逃逸、`Starter.kt` 的 `LD_LIBRARY_PATH` 注入；
              - 同步 `AdbClient` 5 分钟密钥授权等待（`keyOfferInFlight`）、`AdbStarter` 先切 `tcpip:5555` 再执行自提权加固（`WRITE_SECURE_SETTINGS`、`ACCESS_RESTRICTED_SETTINGS`、Doze 白名单、`SCHEDULE_EXACT_ALARM`）；
              - 同步 `WatchdogService` + `WatchdogWorker`（每 2 小时 + Android 15 锁屏加急通道）+ `WatchdogAlarmReceiver`（每 15 分钟 `RTC_WAKEUP` 精确闹钟跨进程唤醒）三层保活自愈机制。
          files: |
            releases/Shizuku-Sam-v13.8.6.apk

      - name: Publish Release v13.8.7 (Plan A UI Refactor & Background AOT Precompile Service)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.7
          name: "Shizuku Sam v13.8.7 — 应用预编译方案 A 落地 & 后台前台服务实时进度保活"
          body: |
            ### Shizuku Sam v13.8.7

            #### 🎨 方案 A 界面重构与文案优化（消除概念认知混淆）
            - **功能按钮直观重命名**：
              - `自选应用编译`（原「指定应用预编译」）：支持在应用列表自主挑选，自由选择「热点极速」、「全量深度」或「重置缓存」。
              - `优化系统与桌面`（原「核心应用预编译」）：针对系统桌面（Launcher）、SystemUI、系统设置、图库及核心组件执行热点极速优化，桌面滑动与手势即刻丝滑。
              - `全部应用极速优化`（原「全量应用预编译」）：对手机内所有已安装应用批量执行热点极速优化，告别应用冷启动卡顿。
              - `清除编译缓存`：清除所有预编译缓存，恢复系统默认初始状态。
            - **卡片说明彻底重写**：清晰拆解「编译深度」（⚡ 热点极速 `speed-profile` vs 🔥 深度全量 `speed`）与「优化范围」（系统桌面组件 vs 全机应用 vs 自选特定应用），消除“全量”词义重叠与“核心”黑盒猜谜。

            #### ⚡ 后台预编译前台服务（AotCompileService）与防杀保活
            - **全新前台服务 (`AotCompileService.kt`)**：
              - 注册 `foregroundServiceType="dataSync"`，并在后台运行期间全程持有 CPU `PARTIAL_WAKE_LOCK`（带 1 小时安全超时自动释放机制），锁屏或退到后台也能保障 `dex2oat` 完整执行不被系统休眠冻结或终止。
            - **通知栏 / 状态栏变动指示**：
              - 标题与进度：`全部应用极速优化 [当前第几个/总数] (百分比)`，并伴随持续变动的原生进度条与百分比指示。
              - 副文本与秒级变动：`正在优化：应用名称 · 已耗时 Xs`，内部协程每秒实时刷新变动，让用户明确感知正在进行。
              - 通知附带「取消编译」动作按钮，点击通知主体可直接返回 App 并恢复前台进度弹窗。
              - 任务完成时，通知栏推送总结通知（如：`🎉 全部应用极速优化已完成 · 已完成 45/45 个应用 · 总耗时 1分28秒`）。
            - **预编译弹窗新增「转到后台」按钮**：
              - 弹窗底部提供「转到后台」按钮，点击后提示 `⚡ 已转入后台继续编译，可在通知栏查看变动进度与耗时` 并关闭弹窗，任务在后台无缝持续执行。
              - 弹窗中亦有当前应用已耗时、总耗时、已成功数等实时数据。
            - **双向无缝切回与恢复**：
              - 当任务在后台运行中时，进入页面会在卡片上看到动态提示条：`⚡ 后台正在优化中：[N/Total] (X%) · 点击查看实时进度`。
              - 无论是点击该提示条、点击通知栏通知，还是再次点击「自选应用编译」/「优化系统与桌面」/「全部应用极速优化」，都会直接重新弹出实时进度弹窗，无缝接续当前编译状态。
          files: |
            releases/Shizuku-Sam-v13.8.7.apk

      - name: Publish Release v13.8.8 (One UI 9 & Android 17 Full Adaptation, Fix Authorized App Disappearance)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.8
          name: "Shizuku Sam v13.8.8 — One UI 9 / 安卓 17 深度适配 & 彻底修复已授权应用消失与列表空白"
          body: |
            ### Shizuku Sam v13.8.8

            #### 🎯 针对 One UI 9 (Android 17) 与上游 Shizuku 核心 100% 深度适配与修复
            - **彻底修复已授权应用消失与弹窗允许后不显示问题 (`AuthorizationManager.kt` / `ShizukuService.java` / `ShizukuConfigManager.java`)**：
              - **本地 PMS 智能容灾兜底**：适配 Android 17 / One UI 9 底层重构后的 `IPackageManager` 与 Binder 传输机制。针对多应用安装设备，在底层反射兼容层异常返回空时，无缝激活管理端本地 PMS 兜底扫描，通过管理端自身的 `QUERY_ALL_PACKAGES` 权限与 API 37 机制完整补全应用列表，杜绝已授权应用列表显示空白；
              - **权限双向实时校验与自愈**：在管理端 `granted()`、`grant()`、`revoke()` 中实施 Shizuku UID 内存标志与系统标准运行时权限 `moe.shizuku.manager.permission.API_V23` 的双向同步，即使服务端重启或配置临时重置，已授权应用的权限记录也永不丢失；
              - **服务端配置自动补全与自愈**：在权限确认广播和配置持久化加载时，自动校验并补齐包名列表，杜绝空包名导致过滤失败或误删配置。
            - **已授权应用管理页面全生命周期感知 (`ApplicationManagementActivity.kt`)**：
              - 页面切回前台（`onResume`）自动静默刷新已授权应用列表，在第三方应用请求权限并返回后即刻高亮展示；
              - 优化加载失败处理逻辑，遇到瞬时异常优雅保留列表与重试，不再闪退关闭页面。

            #### 🔄 核心协议与接口 100% 对齐上游原生 Shizuku
            - 严格遵循上游 Shizuku 核心架构、AIDL 事务号、Token 校验与权限掩码设计，不擅自增删协议字段，确保对所有调用 Shizuku API 的第三方软件 100% 完美透明兼容。

            #### 🛡️ 系统级防杀与常驻保活体系（Anti-Kill Keepalive）
            - **Watchdog 守护服务**：精准声明 Android 14+ / 17 严格强制要求的 `specialUse` 前台服务类型与系统属性；
            - **AOT 预编译后台服务 (`AotCompileService.kt`)**：采用 `dataSync` 前台服务结合 CPU `PARTIAL_WAKE_LOCK`，锁屏或退至后台持续保活运行；
            - **ADB 自动提权与白名单注入**：自动配置 `dumpsys deviceidle whitelist` 电池不优化白名单与应用活跃桶（`active`）。

            #### ⚡ 16KB ELF 页面对齐与 API 37 编译构建
            - **JNI CMake 全架构 16KB 页表支持**：全架构编译注入 `-Wl,-z,max-page-size=16384`，完美适配 Galaxy S24 / S25 / S26 等 One UI 9 设备的 16KB 页表内核；
            - **SDK 全面升级**：`compileSdk = 37`，`targetSdk = 37`，Java 21 现代工具链。
          files: |
            releases/Shizuku-Sam-v13.8.8.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7' && github.ref_name != 'v13.7.8' && github.ref_name != 'v13.7.9' && github.ref_name != 'v13.8.0' && github.ref_name != 'v13.8.1' && github.ref_name != 'v13.8.2' && github.ref_name != 'v13.8.3' && github.ref_name != 'v13.8.4' && github.ref_name != 'v13.8.5' && github.ref_name != 'v13.8.6' && github.ref_name != 'v13.8.7' && github.ref_name != 'v13.8.8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
