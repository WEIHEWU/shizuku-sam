name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.4 (Full-App Unified Miuix UI & On-Demand Subtitle Toggle)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.4
          name: "Shizuku Sam v13.8.4 — 全应用一级/二级/三级页面及弹窗全面统一 Miuix 视觉组件与按需说明开关"
          body: |
            ### Shizuku Sam v13.8.4
            - **全应用 100% 统一 Miuix (`top.yukonga.miuix.kmp`) 视觉与组件体系**：
              - **二级/三级 Compose 子页面全面重构为原生 Miuix**：
                - **设置中心 (`SettingsGlassScreen.kt`)**：升级为 Miuix `Scaffold` + `overScrollVertical()` 弹性阻尼滚动 + 无描边 `20.dp` Miuix `Card` + Miuix `SwitchPreference` / `ArrowPreference`；端口号修改弹窗与主题选择弹窗全部升级为 Miuix `WindowDialog`、`TextField` 与 `TextButton`。
                - **应用授权管理页 (`ApplicationManagementActivity.kt`)**：重构为 Miuix Compose 页面（`MiuixSubPageTopBar` + Miuix `Card` + Miuix `BasicComponent` + Miuix `Switch` + Miuix `WindowDialog`）。
                - **无线调试配对教程与手动配对弹窗 (`AdbPairingTutorialActivity.kt`)**：重构为原生 Miuix Compose 页面与 `MiuixManualPairingDialog`（Miuix `WindowDialog` + `TextField` + `TextButton` + `AdbMdns` 自动端口发现）。
                - **终端授权教程页 (`ShellTutorialActivity.kt`) 与服务启动终端页 (`StarterActivity.kt`)**：重构为原生 Miuix Compose 页面与 Miuix `WindowDialog` 异常诊断弹窗。
              - **MaxHz 二级/三级详情页全面对齐 Miuix 规范 (`LiquidGlassTheme.kt` / `MaxHzActivity.kt`)**：
                - 统一亮色 `#F5F6F9` / 深色 `#0D0F12` 页面底色、无描边纯色 `20dp` Miuix 卡片（亮色 `#FFFFFF` / 深色 `#181A20`）、Miuix 蓝开关轨道（`#3482FF` / `#277AF7`）、Miuix 柔和浅色圆角图标底座与 `14dp` 圆角按钮。
            - **全应用统一「方案 B：按需展开说明」极简交互（一级/二级/三级页面全覆盖）**：
              - 所有页面默认仅展示干净利落的单行主标题，彻底消除多行小字视觉噪点；
              - **长按任意单行或卡片**：即可在原位平滑展开/收起该功能的详细说明或包名；
              - **分组/页面右上角 `显示说明 / 隐藏说明` 胶囊开关**：一键切换当前分组或整页全部说明的显示与隐藏。
          files: |
            releases/Shizuku-Sam-v13.8.4.apk

      - name: Publish Future Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v13.7.3' && github.ref_name != 'v13.7.4' && github.ref_name != 'v13.7.5' && github.ref_name != 'v13.7.6' && github.ref_name != 'v13.7.7' && github.ref_name != 'v13.7.8' && github.ref_name != 'v13.7.9' && github.ref_name != 'v13.8.0' && github.ref_name != 'v13.8.1' && github.ref_name != 'v13.8.2' && github.ref_name != 'v13.8.3' && github.ref_name != 'v13.8.4'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shizuku Sam ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            releases/Shizuku-Sam-${{ github.ref_name }}.apk
