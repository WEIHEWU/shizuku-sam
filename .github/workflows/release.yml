name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Release v13.8.6 (Align Startup & Watchdog with ShizukuPlus & Fix AOT Precompile Timeout)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.6
          name: "Shizuku Sam v13.8.6 — 对齐上游保活自愈链路 & 修复微信/抖音等大型应用预编译超时"
          body: |
            ### Shizuku Sam v13.8.6

            #### 🐛 修复 AOT 应用预编译（如微信、抖音）超时与阻塞假死问题
            - **修复未授权 `su` 二进制文件引发的 Shell 阻塞假死 (`ShizukuShellBridge.kt` / `MaxHzShell.kt`)**：
              - 在 `ShizukuShellBridge` 中移除优先尝试 `Shizuku.newProcess(arrayOf("su"))` 的逻辑，直接通过 Shizuku 启动 `/system/bin/sh`；
              - 在 `MaxHzShell.detectRoot()` 中改为先执行 `waitFor(2, TimeUnit.SECONDS)` 再读取输出流，彻底消除部分机器存在未授权 `su` 二进制文件时卡死等待 Root 弹窗导致的 45 秒超时。
            - **对齐 Android 14+ 官方 `ArtService` 主包优先与增量编译策略 (`MaxHzActivity.kt`)**：
              - **热点极速 (`speed-profile`)**：优先使用 `--split ""` 仅重编主包 `base.apk`（跳过微信/抖音动态加载的几十个小程序/商城/直播插件 Secondary Dex），并在旧系统上自动回退增量编译（不加 `-f`）；
              - **全量编译 (`speed`)**：优先执行增量编译（复用已编译的动态插件），若未触发则使用 `--split "" -f` 强制重编主包 `base.apk`。
            - **放宽单应用超时阈值与实时秒数显示 (`MaxHzActivity.kt`)**：
              - 单应用超时阈值提升至 `speed-profile` **180 秒** / `speed` **360 秒**，编译弹窗实时刷新已耗时秒数（如 `已耗时 12s`），并修正不同编译模式的专属超时提示文案。

            #### 🔄 启动、配对与看门狗保活链路 1:1 严格对齐上游 `ShizukuPlus`
            - **对齐 C++ 启动器与看门狗三层保活自愈体系**：
              - 同步 `starter.cpp` 管道同步等待（`pipe` + `poll`）与 `switch_cgroup()` 逃逸、`Starter.kt` 的 `LD_LIBRARY_PATH` 注入；
              - 同步 `AdbClient` 5 分钟密钥授权等待（`keyOfferInFlight`）、`AdbStarter` 先切 `tcpip:5555` 再执行自提权加固（`WRITE_SECURE_SETTINGS`、`ACCESS_RESTRICTED_SETTINGS`、Doze 白名单、`SCHEDULE_EXACT_ALARM`）；
              - 同步 `WatchdogService` + `WatchdogWorker`（每 2 小时 + Android 15 锁屏加急通道）+ `WatchdogAlarmReceiver`（每 15 分钟 `RTC_WAKEUP` 精确闹钟跨进程唤醒）三层保活自愈机制。
          files: |
            releases/Shizuku-Sam-v13.8.6.apk

      - name: Publish Release v13.8.7 (Plan A UI Refactor & Background AOT Precompile Service)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.7
          name: "Shizuku Sam v13.8.7 — 应用预编译方案 A 落地 & 后台前台服务实时进度保活"
          body: |
            ### Shizuku Sam v13.8.7

            #### 🎨 方案 A 界面重构与文案优化（消除概念认知混淆）
            - **功能按钮直观重命名**：
              - `自选应用编译`（原「指定应用预编译」）：支持在应用列表自主挑选，自由选择「热点极速」、「全量深度」或「重置缓存」。
              - `优化系统与桌面`（原「核心应用预编译」）：针对系统桌面（Launcher）、SystemUI、系统设置、图库及核心组件执行热点极速优化，桌面滑动与手势即刻丝滑。
              - `全部应用极速优化`（原「全量应用预编译」）：对手机内所有已安装应用批量执行热点极速优化，告别应用冷启动卡顿。
              - `清除编译缓存`：清除所有预编译缓存，恢复系统默认初始状态。
            - **卡片说明彻底重写**：清晰拆解「编译深度」（⚡ 热点极速 `speed-profile` vs 🔥 深度全量 `speed`）与「优化范围」（系统桌面组件 vs 全机应用 vs 自选特定应用），消除“全量”词义重叠与“核心”黑盒猜谜。

            #### ⚡ 后台预编译前台服务（AotCompileService）与防杀保活
            - **全新前台服务 (`AotCompileService.kt`)**：
              - 注册 `foregroundServiceType="dataSync"`，并在后台运行期间全程持有 CPU `PARTIAL_WAKE_LOCK`（带 1 小时安全超时自动释放机制），锁屏或退到后台也能保障 `dex2oat` 完整执行不被系统休眠冻结或终止。
            - **通知栏 / 状态栏变动指示**：
              - 标题与进度：`全部应用极速优化 [当前第几个/总数] (百分比)`，并伴随持续变动的原生进度条与百分比指示。
              - 副文本与秒级变动：`正在优化：应用名称 · 已耗时 Xs`，内部协程每秒实时刷新变动，让用户明确感知正在进行。
              - 通知附带「取消编译」动作按钮，点击通知主体可直接返回 App 并恢复前台进度弹窗。
              - 任务完成时，通知栏推送总结通知（如：`🎉 全部应用极速优化已完成 · 已完成 45/45 个应用 · 总耗时 1分28秒`）。
            - **预编译弹窗新增「转到后台」按钮**：
              - 弹窗底部提供「转到后台」按钮，点击后提示 `⚡ 已转入后台继续编译，可在通知栏查看变动进度与耗时` 并关闭弹窗，任务在后台无缝持续执行。
              - 弹窗中亦有当前应用已耗时、总耗时、已成功数等实时数据。
            - **双向无缝切回与恢复**：
              - 当任务在后台运行中时，进入页面会在卡片上看到动态提示条：`⚡ 后台正在优化中：[N/Total] (X%) · 点击查看实时进度`。
              - 无论是点击该提示条、点击通知栏通知，还是再次点击「自选应用编译」/「优化系统与桌面」/「全部应用极速优化」，都会直接重新弹出实时进度弹窗，无缝接续当前编译状态。
          files: |
            releases/Shizuku-Sam-v13.8.7.apk

      - name: Publish Release v13.8.8 (One UI 9 & Android 17 Full Adaptation, Fix Authorized App Disappearance)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.8
          name: "Shizuku Sam v13.8.8 — One UI 9 / 安卓 17 深度适配 & 彻底修复已授权应用消失与列表空白"
          body: |
            ### Shizuku Sam v13.8.8

            #### 🎯 针对 One UI 9 (Android 17) 与上游 Shizuku 核心 100% 深度适配与修复
            - **彻底修复已授权应用消失与弹窗允许后不显示问题 (`AuthorizationManager.kt` / `ShizukuService.java` / `ShizukuConfigManager.java`)**：
              - **本地 PMS 智能容灾兜底**：适配 Android 17 / One UI 9 底层重构后的 `IPackageManager` 与 Binder 传输机制。针对多应用安装设备，在底层反射兼容层异常返回空时，无缝激活管理端本地 PMS 兜底扫描，通过管理端自身的 `QUERY_ALL_PACKAGES` 权限与 API 37 机制完整补全应用列表，杜绝已授权应用列表显示空白；
              - **权限双向实时校验与自愈**：在管理端 `granted()`、`grant()`、`revoke()` 中实施 Shizuku UID 内存标志与系统标准运行时权限 `moe.shizuku.manager.permission.API_V23` 的双向同步，即使服务端重启或配置临时重置，已授权应用的权限记录也永不丢失；
              - **服务端配置自动补全与自愈**：在权限确认广播和配置持久化加载时，自动校验并补齐包名列表，杜绝空包名导致过滤失败或误删配置。
            - **已授权应用管理页面全生命周期感知 (`ApplicationManagementActivity.kt`)**：
              - 页面切回前台（`onResume`）自动静默刷新已授权应用列表，在第三方应用请求权限并返回后即刻高亮展示；
              - 优化加载失败处理逻辑，遇到瞬时异常优雅保留列表与重试，不再闪退关闭页面。

            #### 🔄 核心协议与接口 100% 对齐上游原生 Shizuku
            - 严格遵循上游 Shizuku 核心架构、AIDL 事务号、Token 校验与权限掩码设计，不擅自增删协议字段，确保对所有调用 Shizuku API 的第三方软件 100% 完美透明兼容。

            #### 🛡️ 系统级防杀与常驻保活体系（Anti-Kill Keepalive）
            - **Watchdog 守护服务**：精准声明 Android 14+ / 17 严格强制要求的 `specialUse` 前台服务类型与系统属性；
            - **AOT 预编译后台服务 (`AotCompileService.kt`)**：采用 `dataSync` 前台服务结合 CPU `PARTIAL_WAKE_LOCK`，锁屏或退至后台持续保活运行；
            - **ADB 自动提权与白名单注入**：自动配置 `dumpsys deviceidle whitelist` 电池不优化白名单与应用活跃桶（`active`）。

            #### ⚡ 16KB ELF 页面对齐与 API 37 编译构建
            - **JNI CMake 全架构 16KB 页表支持**：全架构编译注入 `-Wl,-z,max-page-size=16384`，完美适配 Galaxy S24 / S25 / S26 等 One UI 9 设备的 16KB 页表内核；
            - **SDK 全面升级**：`compileSdk = 37`，`targetSdk = 37`，Java 21 现代工具链。
          files: |
            releases/Shizuku-Sam-v13.8.8.apk

      - name: Publish Release v13.8.9 (Android 17 ACCESS_LOCAL_NETWORK Runtime Grant, Android17Compat Deep Integration, Relaxed Discovery Timeouts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.9
          name: "Shizuku Sam v13.8.9 — 深度融合 thedjchi / Nightzuku Android 17 网络权限补丁与服务端反射兼容"
          body: |
            ### Shizuku Sam v13.8.9

            #### 🌐 Android 17 / One UI 9 无线配对与局域网网络权限深度修复
            - **`ACCESS_LOCAL_NETWORK` (SDK 37) 与 `NEARBY_WIFI_DEVICES` (SDK 36) 运行时主动申请 (`AdbPairingTutorialActivity.kt`)**：
              - 适配 Android 17 / One UI 9 对本地网络沙盒的强力管控。在启动无线配对前台服务前，主动发起运行时权限申请，彻底解决 Android 17 系统弹出的死循环「选择要连接的设备」设备选择器（Choose a device to connect）弹窗拦截；
            - **服务端 Android 17 反射兼容层全面整合 (`Android17Compat.java` / `InstalledPackagesCompat.java`)**：
              - 针对 Android 17 底层 `IPermissionManager` 引入的 `deviceId = 0` 参数与 5 参数的 `revokeRuntimePermission`，以及 `flags` 全面迁移为 `long` 的变动，在 `ShizukuService`、`ShizukuConfigManager`、`BinderSender` 与 `ShizukuUserServiceManager` 中全面采用动态签名自适应反射兼容，杜绝底层 `NoSuchMethodError`；
              - 服务端应用枚举全面迁移至 `InstalledPackagesCompat`，自动兼容 `PackageInfoList` 与 `ParceledListSlice` 双数据结构；
            - **慢速与负载场景超时容错放宽**：
              - mDNS 搜索发现超时放宽至 45 秒，Binder 启动等待从 20 秒提升至 60 秒，大幅改善开机初期的启动与连接稳定性。

            #### 🔄 核心协议与防杀体系
            - 100% 对齐原生 Shizuku 核心协议；
            - 保留 Watchdog `specialUse` 服务、`AotCompileService` 前台服务带 WakeLock，以及 16KB 内存页面对齐。
          files: |
            releases/Shizuku-Sam-v13.8.9.apk

      - name: "Publish Release v13.8.10 (Plan A Segmented Tabs in AOT Picker Dialog)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.8.10
          name: "Shizuku Sam v13.8.10 — 自选应用 ART 预编译双分类分栏（方案 A 顶部分段选择器）"
          body: |
            ### Shizuku Sam v13.8.10

            #### ⚡ 自选应用 ART 预编译加速双分类分栏体系（方案 A）
            - **顶部 One UI 9 风格分段选择器（Segmented Tabs）**：
              - 「⚡ 未编译 (N)」与「✅ 已编译 (M)」双分栏设计，默认进入「未编译」视图，分类清晰直观；
              - 切换标签页具备 One UI 触控震动反馈与安全防误触机制，标签页间自动隔离勾选状态；
            - **模式选择与操作按钮动态智能联动**：
              - 「未编译」标签页智能隐藏无意义的「重置缓存」，聚焦「热点极速」与「全量编译」，底部按钮呈现「开始编译」；
              - 「已编译」标签页提供「热点极速」、「全量编译」与「重置缓存」三重选项，选择「重置缓存」时按钮联动更新为「清除缓存」；
            - **双向缓存状态同步与精准列表过滤**：
              - 修复 `AotCompileService` 缓存重置后未更新 Shizuku Prefs 记录的问题，成功重置后应用无缝回流至「未编译」标签页；
              - 列表项支持「已全量 / 已热点 / 未编译」全状态胶囊徽标展示；
              - 搜索栏与「用户 / 全部 / 系统」子分类芯片与当前标签页完全联动，并新增优雅的空状态提示。

            #### 🔄 核心协议与防杀体系
            - 100% 对齐原生 Shizuku 核心协议；
            - 延续 Android 17 / One UI 9 `ACCESS_LOCAL_NETWORK` 运行时权限主动申请与底层反射兼容层；
            - 保留 Watchdog `specialUse` 服务、`AotCompileService` 前台服务带 WakeLock，以及 16KB 内存页面对齐。
          files: |
            releases/Shizuku-Sam-v13.8.10.apk

      - name: "Publish Release v13.8.11 (Plan A One UI 9 Modal Sheet Architecture)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.11')
        with:
          tag_name: v13.8.11
          name: "Shizuku Sam v13.8.11 — 极致 One UI 9 统一模态架构（全界面 100% 弹窗化 + 弹窗内平滑推入导航）"
          body: |
            ### Shizuku Sam v13.8.11

            #### 🌟 极致 One UI 9 统一模态架构（方案 A 全界面 100% 弹窗化）
            - **全应用二级/三级菜单 100% 弹窗化**：
              - 底层导航引擎 `pushDetail` 全面重构为 One UI 9 模态大浮层（Modal Sheet）；
              - 采用 24dp 圆角卡片、微暗半透明背景蒙层（0.55f Dim）、94% 屏宽（上限 580dp 适配折叠屏与平板）及 85% 视高，高质感呈现；
              - 顶部集成 One UI 9 标志性拖拽胶囊把手（Drag Handle Pill）与常驻吸顶标题栏。
            - **弹窗内层平滑推入导航（优雅解决三级菜单嵌套）**：
              - 从二级菜单进入三级菜单时，弹窗外框不动，内部内容平滑左右水平推入过渡；
              - 标题栏自动显现「‹ 返回」按钮，点击或系统返回键平滑逐级回退；
              - 彻底消除多层弹窗蒙层叠罗汉导致的变脏变暗与误触关闭问题。
            - **底层主页与毛玻璃悬浮 Dock 永驻不闪烁**：
              - 弹窗呼出时，三大 Tab 仪表盘（`Shizuku` · `性能硬件` · `应用规则`）与底部悬浮毛玻璃 Dock 自然沉底于蒙层下方；
              - 彻底告别旧版切页隐藏 Dock 导致的页面跳动与重绘闪烁，随开随走，零上下文丢失。
            - **常驻吸顶 Option B 说明胶囊与全弹窗视觉统一**：
              - 弹窗顶部常驻「显示说明 / 隐藏说明」按需展开胶囊，智能识别有无说明内容；
              - 「电池信息与健康度」、「充电上限保护」及「自选应用编译」等所有弹窗全面对齐 One UI 9 规范。

            #### 🔄 核心协议与防杀体系
            - 100% 对齐原生 Shizuku 核心协议；
            - 延续 Android 17 / One UI 9 `ACCESS_LOCAL_NETWORK` 运行时权限主动申请与底层反射兼容层；
            - 保留 Watchdog `specialUse` 服务、`AotCompileService` 前台服务带 WakeLock，以及 16KB 内存页面对齐。
          files: |
            releases/Shizuku-Sam-v13.8.11.apk

      - name: "Publish Release v13.8.19 (Fix Permission Request Dialog Layout Collapse)"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v13.8.19')
        with:
          tag_name: v13.8.19
          name: "Shizuku Sam v13.8.19 — 修复第三方应用特权授权弹窗坍塌变形与无法授权问题"
          body: |
            ### Shizuku Sam v13.8.19

            #### 🐛 彻底修复第三方应用请求特权授权弹窗横向坍塌变形缺陷
            - **解决浮动窗口测量坍塌导致按钮消失问题 (`confirmation_dialog.xml` / `RequestPermissionActivity.kt`)**：
              - 彻底解决第三方应用（如 Samsung Root、Scene 等）调用 `Shizuku.requestPermission()` 请求授权时，浮动透明 Activity 宽度测量塌陷为 60px 窄条胶囊、导致应用名称被截断且「始终允许 / 拒绝」按钮全部消失无法点击的问题；
              - `confirmation_dialog.xml` 增加防御性最小宽度约束（`android:minWidth="320dp"`），修正高度为 `wrap_content`；
              - `RequestPermissionActivity` 窗口分配屏幕 92% 黄金宽度（上限 520dp）。
            - **全量接入 Monet 动态取色与圆角浮层规范**：
              - 权限请求弹窗及受限调试弹窗全面接入 `DialogThemeHelper.applyUnifiedDialogWindowStyle`；
              - 具备 24dp 优雅圆角、微暗半透明背景与动态壁纸取色适配，居中显示，触控精准丝滑。
            - **修正样式属性引用 (`styles.xml`)**：
              - 修正 `?textColorOnPrimaryContainer` 为标准 `?colorOnPrimaryContainer` 属性。

            #### 🎨 全应用弹窗动态主题色彩与排版优化（继承 v13.8.18）
            - 全应用一级主界面、二级模态浮层、三级/四级/五级弹窗（包括权限确认、应用挑选器、AOT 预编译、白名单冲突警示、运行报告等）全面接入 `DialogThemeHelper` 动态取色规范；
            - 进游戏模式多选项按钮与应用挑选器筛选芯片全量自适应文字排版与缩放，杜绝文字挤压与截断；
            - 极速待机（Quick Doze）自适应伸缩收折，无多余空白。
          files: |
            releases/Shizuku-Sam-v13.8.19.apk

